{% extends "base.html" %}
{% block content %}

<div class="form-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Add New Household</h1>
            <p>Establish a new residential unit in the community registry.</p>
        </div>

        <form method="POST">
            <input type="hidden" name="from_member" value="{{ from_member }}">
            <input type="hidden" name="fname" value="{{ fname }}">
            <input type="hidden" name="mname" value="{{ mname }}">
            <input type="hidden" name="sname" value="{{ sname }}">
            <input type="hidden" name="age" value="{{ age }}">
            <input type="hidden" name="birthdate" value="{{ birthdate }}">
            <input type="hidden" name="gender" value="{{ gender }}">
            <input type="hidden" name="civil_status" value="{{ civil_status }}">
            <input type="hidden" name="occupation" value="{{ occupation }}">

            <div class="form-group">
                <label>Household Surname</label>
                <input type="text" name="surname" placeholder="e.g., Dela Cruz" required autocomplete="off">
            </div>

            <div class="form-grid dual">
                <div class="form-group">
                    <label>House Number</label>
                    <input type="text" name="house_number" placeholder="e.g., 182-A" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label>Purok / Zone</label>
                    <input type="text" name="address" placeholder="e.g., Purok 1" required autocomplete="off">
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit">Register Household</button>
                
                {% if from_member == 'true' or fname or sname %}
                    <a href="{{ url_for('add_member', fname=fname, mname=mname, sname=sname, age=age, birthdate=birthdate, gender=gender, civil_status=civil_status, occupation=occupation) }}" class="btn-back">
                        Back to Resident Form
                    </a>
                {% else %}
                    <a href="{{ url_for('view_households') }}" class="btn-back">
                        Back to Household List
                    </a>
                {% endif %}
            </div>
        </form>
    </div>
</div>

<div id="errorModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon"><i data-lucide="alert-circle"></i></div>
        <h3>Action Denied</h3>
        <p id="errorText">{{ error }}</p>
        <div class="modal-footer">
            <button class="modal-btn confirm" onclick="closeErrorModal()">Got it</button>
        </div>
    </div>
</div>

<style>
    :root {
        --primary: #1B3A57;
        --accent: #3498db;
        --bg-light: #f4f7fb;
        --text-muted: #666;
    }

    .form-container { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        padding: 40px 20px; 
        min-height: 80vh; 
        background-color: var(--bg-light);
        font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    .form-card { 
        background: white; 
        padding: 40px; 
        border-radius: 15px; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
        width: 100%; 
        max-width: 500px; 
        border: 1px solid #edf2f7;
    }

    .form-header { text-align: center; margin-bottom: 30px; }
    .form-header h1 { margin: 0; color: var(--primary); font-size: 26px; font-weight: 800; }
    .form-header p { margin: 5px 0 0; color: var(--text-muted); font-size: 14px; }

    .form-grid { display: grid; gap: 15px; }
    .form-grid.dual { grid-template-columns: 1fr 1fr; }

    .form-group { display: flex; flex-direction: column; margin-bottom: 18px; }
    .form-group label { margin-bottom: 8px; font-weight: 700; color: var(--primary); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .form-group input { 
        width: 100%; 
        padding: 13px 16px; 
        border-radius: 10px; 
        border: 2px solid #edf2f7; 
        font-size: 15px; 
        background-color: #fdfdfd; 
        box-sizing: border-box; 
        transition: all 0.3s ease; 
        color: #333;
    }

    .form-group input:focus { 
        outline: none; 
        border-color: var(--accent); 
        background-color: #fff; 
        box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1);
    }

    .form-actions {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
    }

    .btn-submit { 
        width: 100%; 
        padding: 16px; 
        border: none; 
        background-color: var(--primary); 
        color: white; 
        font-size: 16px; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: 800; 
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(27, 58, 87, 0.2);
    }

    .btn-submit:hover { 
        background-color: #142d44; 
        transform: translateY(-2px); 
    }

    .btn-back {
        text-decoration: none;
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
        transition: all 0.2s;
        padding: 8px;
        opacity: 0.7;
    }

    .btn-back:hover {
        opacity: 1;
        text-decoration: underline;
    }

    .modal-overlay { 
        display: none; 
        position: fixed; 
        top: 0; left: 0; width: 100%; height: 100%; 
        background: rgba(27, 58, 87, 0.5); 
        z-index: 10000; 
        align-items: center; justify-content: center; 
        backdrop-filter: blur(4px); 
    }
    .modal-content { 
        background: white; 
        padding: 35px; 
        border-radius: 15px; 
        width: 380px; 
        text-align: center; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
    }
    .modal-icon { color: #e74c3c; font-size: 45px; margin-bottom: 15px; }
    .modal-footer { margin-top: 25px; }
    .modal-btn.confirm { 
        background: var(--primary); 
        color: white; 
        padding: 12px 35px; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        font-weight: 800; 
        transition: 0.2s; 
    }
    .modal-btn.confirm:hover { opacity: 0.9; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const errorMessage = "{{ error }}";
    if (errorMessage && errorMessage !== "None" && errorMessage !== "") {
        document.getElementById('errorModal').style.display = 'flex';
    }
});

function closeErrorModal() {
    document.getElementById('errorModal').style.display = 'none';
}

window.onclick = function(event) {
    let modal = document.getElementById('errorModal');
    if (event.target == modal) {
        closeErrorModal();
    }
}
</script>
{% endblock %}
